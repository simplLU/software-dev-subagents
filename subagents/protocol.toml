# =============================================================================
# protocol.toml —— 软件开发类子代理团队 · 全局协作协议（宪法）
# =============================================================================
# 版本: 0.1.0
# 适用范围: 本目录（subagents/）下的 5 个角色:
#   router(路由) / leader(调度) / planner(规划师) / worker(执行者) / reviewer(审核)
#
# 设计原则:
#   1. 单一事实来源 —— 路径所有权、交接格式、闸门、路由表只在本文件定义,
#      角色文件只声明差异; scripts/validate_agents.py 自动校验一致性。
#   2. 单写者原则 —— 同一路径同一时刻只允许一个角色写入, 从制度上避免写冲突。
#   3. 分权制衡 —— 写代码的人不评审代码, 评审的人不改代码, 调度的人不写实现。
#   4. 一切留痕 —— 每次请求 = 一个独立 run, 产物全部落在 runs/<run_id>/。
#   5. 不猜需求 —— 信息不足就提问或标注假设, 绝不擅自扩大范围。
#
# 修改本文件后务必运行:
#   python subagents/scripts/validate_agents.py
# =============================================================================

schema_version = "1.0"
protocol_id = "software-dev-team"
protocol_version = "0.1.0"
description = "面向软件开发 / 代码编写场景的 5 角色子代理协作协议"
language = "zh-CN"

# 受保护路径: 任何角色默认不可写, 必须由人类显式批准
protected_paths = [
  ".git/**",
  ".env",
  ".env.*",
  "**/*.pem",
  "**/*.key",
  ".github/workflows/**",
  "deploy/**",
  "infra/**",
  "secrets/**",
  "migrations/**",
  "package.json",
  "pnpm-lock.yaml",
  "pyproject.toml",
  "requirements*.txt",
]
protected_rule = "受保护路径只有任务信封显式声明 allow_protected = true 且 leader 批准后才可修改; 否则一律拒绝并升级人类"

# -----------------------------------------------------------------------------
# 1. Run（任务运行）模型
# -----------------------------------------------------------------------------
[run]
# 一次用户请求 = 一个 run。所有中间产物写入独立目录, 多次任务互不污染。
artifact_root = "runs/{run_id}"
run_id_format = "YYYYMMDD-HHMMSS-<slug>"
# 标准阶段顺序; review_only / spike 流水线允许跳过 implement 等阶段
phase_order = ["route", "plan", "implement", "review", "deliver"]
# 每个 run 必须有一个总入口（leader）负责收口
entry_role = "leader"
owner_role = "leader"

# -----------------------------------------------------------------------------
# 2. 交接规则（handoff）
# -----------------------------------------------------------------------------
[handoff]
# 角色之间只通过结构化信封交接, 不靠"口头约定"或隐含上下文
required_fields = [
  "run_id", "task_id", "from", "to", "phase",
  "summary", "artifacts", "open_questions",
]
# 下游只信任 artifacts 中列出的产物路径; 未列出的产物视为不存在
trust_rule = "下游只信任 artifacts 中列出的路径; 需要额外材料必须回退上游或升级 leader"
# 交接即冻结: 下游发现输入不足只能回退或升级, 禁止自行脑补
freeze_rule = "交接后上游产物冻结; 修改必须走 leader 确认的新版本"
# 一次交接最多携带的未决问题数, 超出视为分工不清晰
max_open_questions = 3

# -----------------------------------------------------------------------------
# 3. 路径所有权（单写者原则）
# -----------------------------------------------------------------------------
# 路径模式相对 run 的工作目录（仓库根）。同一角色内的路径不得与其他角色重叠;
# 角色 TOML 的 authority.write 必须与本表完全一致（由校验脚本强制）。
[ownership]
planner  = ["runs/{run_id}/plan.md", "runs/{run_id}/tasks.json", "docs/specs/**"]
leader   = ["runs/{run_id}/board.md", "runs/{run_id}/report.md", "runs/{run_id}/handoffs/**"]
worker   = ["src/**", "tests/**", "scripts/**", "runs/{run_id}/impl/**"]
reviewer = ["runs/{run_id}/review.md", "runs/{run_id}/review_<task_id>.json"]
router   = ["runs/{run_id}/route.json"]

# -----------------------------------------------------------------------------
# 4. 版本控制约定（若仓库启用 git; 否则跳过本节）
# -----------------------------------------------------------------------------
[git]
enabled = true
branch_format = "agent/{run_id}"
commit_format = "task(<task_id>): <type>: <summary>"
rule = "worker 只在 run 分支提交; planner / reviewer / leader 不提交代码; 禁止 force-push 共享分支"

# -----------------------------------------------------------------------------
# 5. 质量与预算
# -----------------------------------------------------------------------------
[quality]
definition_of_done = [
  "plan 中的 acceptance 项全部有可复核证据",
  "相关自动化测试通过; 无法运行时必须记录客观原因与替代证据",
  "reviewer 结论为 approve",
  "所有变更文件均落在授权写域内",
  "leader 已在 report.md 中汇总证据并给出交付结论",
]
max_tasks_per_run = 12
max_parallel_workers = 3
max_review_rounds = 3
max_plan_rounds = 2
# 同一评审问题连续出现 2 轮仍未解决, 视为结构性缺陷, 升级人类
repeat_issue_escalation = 2

# -----------------------------------------------------------------------------
# 6. 升级规则（任何角色触发即停）
# -----------------------------------------------------------------------------
[escalation]
ladder = ["leader", "human"]
triggers = [
  "需要修改 protected_paths 或引入新依赖",
  "需求范围/验收标准需要变更",
  "连续 2 轮评审未通过且原因相同",
  "发现安全、合规、隐私风险",
  "预算（步数/时间/任务数）即将超限",
  "角色权限不足以完成任务",
]
stop_rule = "触发升级时立即停止当前动作, 在 run 产物中记录原因与已完成部分, 等待 leader 或人类决策"

# -----------------------------------------------------------------------------
# 7. 路由表（router 只做分类与选择, 不得发明流水线）
# -----------------------------------------------------------------------------
[routing]
default_pipeline = "feature"
# 触发这些信号的请求必须先获得人类确认
require_human_approval_for = [
  "修改 protected_paths",
  "新增或升级第三方依赖",
  "数据迁移 / 数据库结构变更",
  "安全、权限、加密相关改动",
  "跨仓库或跨服务变更",
]

# --- 流水线 1: 新功能 ---
[[routing.pipeline]]
id = "feature"
label = "新功能 / 小特性"
when = "需求明确、影响面可控（预计任务数 <= 12）、有明确验收标准"
requires_plan = true
requires_review = true
stages = [
  "leader:init", "planner:plan", "leader:approve_plan",
  "worker:implement", "reviewer:review", "leader:deliver",
]
max_workers = 2
gates = ["plan_approved", "tests_green", "review_approved", "delivery_accepted"]

# --- 流水线 2: 缺陷修复 ---
[[routing.pipeline]]
id = "bugfix"
label = "缺陷修复"
when = "预期行为与现有实现不一致、根因基本明确、改动范围可控"
requires_plan = true
requires_review = true
stages = [
  "leader:init", "planner:diagnose", "leader:approve_plan",
  "worker:implement", "reviewer:review", "leader:deliver",
]
max_workers = 1
gates = ["root_cause_found", "tests_green", "regression_passed", "review_approved"]

# --- 流水线 3: 重构 ---
[[routing.pipeline]]
id = "refactor"
label = "重构 / 技术债清理"
when = "不改变外部行为, 目标是结构、可读性、性能或可维护性"
requires_plan = true
requires_review = true
stages = [
  "leader:init", "planner:plan", "leader:approve_plan",
  "worker:implement", "reviewer:review", "leader:deliver",
]
max_workers = 2
gates = ["behavior_unchanged", "regression_passed", "review_approved"]

# --- 流水线 4: 只评审 ---
[[routing.pipeline]]
id = "review_only"
label = "只评审（不修改代码）"
when = "用户只要求审查代码 / 给出评审意见 / 安全审计"
requires_plan = false
requires_review = true
stages = ["leader:init", "reviewer:review", "leader:deliver"]
max_workers = 0
gates = ["review_approved"]

# --- 流水线 5: 调研 ---
[[routing.pipeline]]
id = "spike"
label = "技术调研 / 可行性验证"
when = "目标不明确或需要先验证方案, 产物是调研笔记而非生产代码"
requires_plan = true
requires_review = false
stages = ["leader:init", "planner:research", "leader:deliver"]
max_workers = 0
gates = ["research_accepted"]

# -----------------------------------------------------------------------------
# 8. 角色清单（供脚本与文档引用, 与同目录 *.toml 一一对应）
# -----------------------------------------------------------------------------
[roles]
# 角色清单: id 与文件名一一对应。新增角色时只需:
#   1) 新增 <id>.toml; 2) 在 [ownership] 增加写域; 3) 在此登记; 4) 运行校验脚本。
router   = "router.toml"
leader   = "leader.toml"
planner  = "planner.toml"
worker   = "worker.toml"
reviewer = "reviewer.toml"
